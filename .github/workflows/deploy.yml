name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@77.42.23.215 'bash -s' <<'EOF'
          set -euo pipefail
          cd /root/ravetycoon
          git fetch --prune origin
          git checkout -B main origin/main
          docker compose up -d --build
          # Le Caddyfile est un bind-mount de fichier unique : `git checkout` le
          # remplace au lieu de l'éditer, le conteneur reste accroché à l'ancien
          # inode et `caddy reload` répond « config is unchanged ». Une route
          # ajoutée ici serait donc ignorée en silence, déploiement vert à l'appui.
          # On ne recrée Caddy que si sa vue du fichier a divergé : les autres
          # déploiements restent sans coupure.
          if ! docker compose exec -T caddy cat /etc/caddy/Caddyfile | diff -q - deploy/Caddyfile >/dev/null 2>&1; then
            echo "Caddyfile modifié — recréation de Caddy pour re-résoudre le bind-mount"
            docker compose up -d --force-recreate --no-deps caddy
          fi
          docker image prune -f
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://ravetycoon.jimmydore.fr/api/health | grep -q '"ok":true'; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: not healthy yet, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 30 attempts"
          exit 1
